<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fc);color:#1d2330;background:var(--fundo);-webkit-font-smoothing:antialiased;line-height:1.55}
a{color:inherit}
.w{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
h1,h2,h3,.tt{font-family:var(--ft);letter-spacing:-.01em}
/* faixa do SAX, fora do site do cliente */
.sax{background:#1d1530;color:#fff;font-family:"Inter Tight",system-ui,sans-serif;position:relative;z-index:60}
.sax .w{display:flex;align-items:center;gap:14px;min-height:56px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.sax .lg{color:#ff7a00;display:flex;align-items:center;gap:10px;text-decoration:none}.sax .lg svg{width:72px;height:auto}
.sax .lg span{font:500 13px/1.1 "Inter Tight",sans-serif;letter-spacing:.06em;color:rgba(255,255,255,.75);padding-left:10px;border-left:1px solid rgba(255,255,255,.25)}
.sax .voltar{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#fff;text-decoration:none;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.1)}
.sax .voltar:hover{background:rgba(255,255,255,.18)}.sax .voltar svg{width:14px;height:14px}
.sax .aviso{font-size:13px;color:rgba(255,255,255,.75)}
.sax .segs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.sax .segs a{font-size:13px;font-weight:600;text-decoration:none;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.25);color:#fff;white-space:nowrap}
.sax .segs a[aria-current=page]{background:#ff7a00;border-color:#ff7a00;color:#1d1530}
.sax .criar{font-size:14px;font-weight:700;background:#ff7a00;color:#1d1530;text-decoration:none;padding:9px 16px;border-radius:10px;white-space:nowrap}
/* site do cliente */
.topo{position:sticky;top:0;z-index:50;background:var(--h);color:var(--ht);border-bottom:1px solid rgba(0,0,0,.08)}
.topo .w{display:flex;align-items:center;justify-content:space-between;gap:16px;height:72px}
.marca{display:flex;align-items:center;gap:10px;font:700 18px var(--ft);text-decoration:none}
.marca i{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--p);color:var(--pt);font:700 14px var(--fc);font-style:normal;border:1px solid rgba(255,255,255,.2)}
.nav{display:flex;align-items:center;gap:4px}
.nav a.l{font-size:14px;font-weight:500;text-decoration:none;padding:8px 12px;border-radius:999px}
.nav a.l:hover{background:rgba(127,127,127,.12)}
.wa{display:inline-flex;align-items:center;gap:8px;background:#1fa855;color:#fff;font-weight:600;text-decoration:none;border-radius:999px;padding:0 16px;height:40px;font-size:14px;border:0;cursor:pointer;font-family:inherit}
.wa svg{width:16px;height:16px}
.wa.g{height:48px;padding:0 24px;font-size:15px}.wa.g svg{width:20px;height:20px}
.ag{display:inline-flex;align-items:center;gap:8px;background:var(--d);color:var(--dt);font-weight:600;text-decoration:none;border-radius:999px;padding:0 16px;height:40px;font-size:14px;border:0;cursor:pointer;font-family:inherit}
.ag.g{height:48px;padding:0 24px;font-size:15px}
.ag svg{width:16px;height:16px}
.hero{background:var(--p);color:var(--pt);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 85% 20%,color-mix(in srgb,var(--d) 45%,transparent),transparent 70%),radial-gradient(40% 60% at 10% 100%,rgba(255,255,255,.12),transparent 70%)}
.hero .arte{position:absolute;right:clamp(-60px,2vw,40px);bottom:-30px;width:clamp(220px,32vw,400px);opacity:.16;color:var(--pt)}
.hero .w{position:relative;min-height:440px;display:flex;flex-direction:column;justify-content:flex-end;padding-top:56px;padding-bottom:56px}
.hero h1{font-size:clamp(34px,5.4vw,56px);line-height:1.06;max-width:15ch;font-weight:700}
.hero p{margin-top:14px;font-size:clamp(16px,1.6vw,19px);max-width:46ch;opacity:.88}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.hero .sec{display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:999px;border:1px solid color-mix(in srgb,var(--pt) 45%,transparent);text-decoration:none;font-weight:600;font-size:15px}
.busca{position:relative;z-index:2;margin-top:-34px}
.busca form{background:#fff;border-radius:18px;padding:14px;display:grid;grid-template-columns:1.6fr 1fr auto;gap:10px;box-shadow:0 24px 48px -24px rgba(20,25,40,.35),0 0 0 1px rgba(20,25,40,.06)}
.busca input,.busca select{height:48px;border-radius:12px;border:1px solid #e3e7ee;padding:0 14px;font:inherit;font-size:15px;background:#fff;color:#1d2330;width:100%}
.busca button{height:48px;border:0;border-radius:12px;padding:0 24px;font:600 15px var(--fc);background:var(--d);color:var(--dt);cursor:pointer}
section.s{padding:64px 0}
.s h2{font-size:clamp(26px,3vw,32px);font-weight:700}
.s .sub2{color:#5b6474;margin-top:4px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px #e3e7ee;display:flex;flex-direction:column}
.foto{aspect-ratio:4/3;position:relative;display:grid;place-items:center;color:var(--p);background:linear-gradient(135deg,color-mix(in srgb,var(--p) 14%,#fff),color-mix(in srgb,var(--d) 22%,#fff))}
.foto svg{width:64px;height:64px;opacity:.75}
.foto .tag{position:absolute;left:12px;top:12px;background:#fff;color:#1d2330;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.foto .res{position:absolute;inset:auto 0 0 0;background:var(--d);color:var(--dt);font-size:12px;font-weight:700;padding:6px 12px}
.card .c{padding:18px 18px 20px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5b6474}
.card h3{font-size:18px;line-height:1.3}
.card .d{font-size:14px;color:#5b6474}
.card .v{margin-top:auto;padding-top:8px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.card .v b{font-size:19px;color:var(--p)}
.card .v span{font-size:13px;color:#5b6474}
.card .bt{display:flex;flex-wrap:wrap;gap:8px;padding-top:8px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.cats button{font:600 14px var(--fc);padding:7px 16px;border-radius:999px;border:1px solid #e3e7ee;background:#fff;color:#5b6474;cursor:pointer}
.cats button[aria-selected=true]{background:var(--p);color:var(--pt);border-color:transparent}
.sobre{background:color-mix(in srgb,var(--p) 6%,#fff)}
.sobre .w{display:grid;grid-template-columns:1fr 1.4fr;gap:32px;align-items:center}
.sobre p{font-size:17px;color:#3b4352;max-width:62ch}
.contato .w{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.contato .box{background:#fff;border-radius:18px;padding:24px;box-shadow:0 0 0 1px #e3e7ee;display:grid;gap:10px}
.contato input,.contato textarea{height:46px;border-radius:12px;border:1px solid #e3e7ee;padding:0 14px;font:inherit;font-size:15px;width:100%}
.contato textarea{height:auto;padding:10px 14px}
.contato .env{height:48px;border:0;border-radius:999px;font:600 15px var(--fc);background:var(--p);color:var(--pt);cursor:pointer}
footer{background:#1d2330;color:#c9cfda;font-size:14px}
footer .w{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-top:32px;padding-bottom:32px}
.flut{position:fixed;right:20px;bottom:20px;z-index:70;width:56px;height:56px;border-radius:50%;background:#1fa855;color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px -8px rgba(31,168,85,.7);border:0;cursor:pointer}
.flut svg{width:28px;height:28px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;transition:.25s;background:#1d1530;color:#fff;font:500 14px "Inter Tight",system-ui;padding:12px 18px;border-radius:12px;z-index:80;max-width:calc(100vw - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fim{background:#1d1530;color:#fff;font-family:"Inter Tight",system-ui,sans-serif;text-align:center;padding:48px 16px}
.fim h2{font-family:"Inter Tight",system-ui;font-size:clamp(24px,3vw,32px)}
.fim p{color:rgba(255,255,255,.75);margin:8px auto 20px;max-width:52ch}
.fim a{display:inline-block;background:#ff7a00;color:#1d1530;font-weight:700;text-decoration:none;padding:14px 24px;border-radius:12px}
@media (max-width:900px){.grid{grid-template-columns:1fr 1fr}.sobre .w,.contato .w{grid-template-columns:1fr}.nav a.l{display:none}.busca form{grid-template-columns:1fr}}
@media (max-width:600px){.grid{grid-template-columns:1fr}.sax .aviso{display:none}.sax .voltar{font-size:12px;padding:6px 10px}.lg-x{display:none}.sax .w{gap:10px}.sax .lg svg{width:58px}.sax .criar{font-size:13px;padding:8px 12px}.sax .segs{margin-left:0;order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.sax .criar{margin-left:auto}.topo .wa .txt{display:none}.marca{font-size:16px}.hero .w{min-height:420px}}
</style>
</head>
